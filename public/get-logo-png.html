<!DOCTYPE html>
<html>
<body>
  <h2>Right-click the image below and select "Save image as..." to get your PNG!</h2>
  <canvas id="canvas" width="1024" height="1024" style="border:1px solid #ccc; max-width: 500px;"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0);
    };
    // The exact SVG string
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
      <rect width="1024" height="1024" rx="256" fill="#FF5630" />
      <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="384" font-weight="900" letter-spacing="-16">JBR</text>
    </svg>`;
    img.src = 'data:image/svg+xml;base64,' + btoa(svg);
  </script>
</body>
</html>
